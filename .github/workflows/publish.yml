name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Version tag to publish (must start with 'v', e.g. v1.0.0)"
        required: true
        type: string

  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate ref is a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ github.event.inputs.ref }}" =~ ^v ]]; then
            echo "Error: ref must start with 'v' (e.g. v1.0.0). Got: ${{ github.event.inputs.ref }}"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to NPM (OIDC Trusted Publishing)
        run: npm publish --provenance --access public
